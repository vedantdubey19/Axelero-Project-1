version: '3.9'

services:
  backend:
    build: .
    container_name: omnibrain_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
    networks:
      - omnibrain_net

  qdrant:
    image: qdrant/qdrant
    container_name: omnibrain_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - omnibrain_net

networks:
  omnibrain_net:
    driver: bridge

volumes:
  qdrant_data:
# fly.toml - OmniBrain Backend deployment configuration for Fly.io
app = "omnibrain-backend"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  LANGFUSE_HOST = "https://cloud.langfuse.com"
  SELF_RAG_MAX_RETRIES = "2"
  ALLOWED_ORIGINS = "*"
  HF_HUB_OFFLINE = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
